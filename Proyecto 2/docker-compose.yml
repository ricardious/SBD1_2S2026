name: bd1-fase2
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Configure .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configure .env}
      IMPORT_DB_PASSWORD: ${IMPORT_DB_PASSWORD:?Configure .env}
    volumes:
      - ./init.sql:/bootstrap/init.sql:ro,z
      - ./docker/init.sh:/bootstrap/init.sh:ro,z
    entrypoint: ["/bin/bash", "/bootstrap/init.sh"]
    restart: "no"
volumes:
  sqlserver-data:
